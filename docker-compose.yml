services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kitaabi:kitaabi@postgres:5432/kitaabi?schema=public
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitaabi
      POSTGRES_PASSWORD: kitaabi
      POSTGRES_DB: kitaabi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitaabi -d kitaabi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  node_modules:
  next_cache:
